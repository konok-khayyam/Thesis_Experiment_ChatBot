<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot Hub</title>
<style>
  :root{--bg:#f6f5f2;--surface:#fff;--text:#1d1d1b;--muted:#6b6a66;--accent:#3b5bdb;--accent-text:#fff;--border:#e3e1dc;--user:#3b5bdb;--bot:#eeece7}
  @media (prefers-color-scheme:dark){:root{--bg:#161616;--surface:#212121;--text:#ececea;--muted:#9a9993;--accent:#7c93f5;--accent-text:#10131f;--border:#333;--user:#4a63d8;--bot:#2c2c2b}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .view{display:none;height:100%;max-width:760px;margin:0 auto;padding:24px 16px}
  .view.active{display:flex;flex-direction:column}
  h1{margin:8px 0 4px;font-size:1.7rem}
  .sub{color:var(--muted);margin:0 0 24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;text-align:left;cursor:pointer;color:inherit;font:inherit;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .card .emoji{font-size:1.8rem}
  .card h2{margin:8px 0 4px;font-size:1.05rem}
  .card p{margin:0;color:var(--muted);font-size:.9rem}
  header{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
  header button{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
  header .title{font-weight:600}
  #messages{flex:1;overflow-y:auto;padding:16px 0;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:80%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{align-self:flex-end;background:var(--user);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
  .msg.error{align-self:flex-start;background:transparent;border:1px solid #d9534f;color:#d9534f}
  .typing{color:var(--muted);font-style:italic}
  form{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--border)}
  textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:12px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--text);max-height:140px}
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  form button{background:var(--accent);color:var(--accent-text);border:0;border-radius:12px;padding:0 20px;font:inherit;font-weight:600;cursor:pointer}
  form button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>

<!-- Screen 1: bot list -->
<section id="list-view" class="view active">
  <h1>Choose a chatbot</h1>
  <p class="sub">Select one of the assistants below to start a conversation.</p>
  <div id="grid" class="grid"></div>
</section>

<!-- Screen 2: chat -->
<section id="chat-view" class="view">
  <header>
    <button id="back">← Back</button>
    <span id="bot-title" class="title"></span>
  </header>
  <div id="messages"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Type a message…" autocomplete="off"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</section>

<script>
/* =====================================================================
   1) CONFIGURE YOUR FOUR N8N BOTS HERE
   ---------------------------------------------------------------------
   url = the "Production URL" of each bot's Chat Trigger (or Webhook) node.
   Replace the four placeholder URLs below.
   ===================================================================== */
const BOTS = [
  { id: "bot1", name: "Bot One",   emoji: "🤖", description: "Describe what this bot does.", url: "https://n8n.media.tuwien.ac.at/webhook/081dece6-bb39-4f2f-9eba-d7d764baa713" },
  { id: "bot2", name: "Bot Two",   emoji: "📚", description: "Describe what this bot does.", url: "https://YOUR-N8N-DOMAIN/webhook/BOT2-ID/chat" },
  { id: "bot3", name: "Bot Three", emoji: "🧠", description: "Describe what this bot does.", url: "https://YOUR-N8N-DOMAIN/webhook/BOT3-ID/chat" },
  { id: "bot4", name: "Bot Four",  emoji: "💬", description: "Describe what this bot does.", url: "https://YOUR-N8N-DOMAIN/webhook/BOT4-ID/chat" },
];

/* =====================================================================
   2) REQUEST / RESPONSE FORMAT  (change only if you use a plain Webhook node)
   ===================================================================== */

// What gets sent to n8n. Default matches the n8n "Chat Trigger" node.
function buildRequestBody(text, sessionId) {
  return { action: "sendMessage", sessionId: sessionId, chatInput: text };
  // For a plain Webhook node you might use instead:
  // return { sessionId, message: text };
}

// How the bot's reply text is pulled out of n8n's response.
function extractReply(data) {
  if (Array.isArray(data)) data = data[0];
  if (typeof data === "string") return data;
  return data?.output ?? data?.text ?? data?.message ?? data?.response ?? JSON.stringify(data);
}

/* ===================================================================== */

const $ = (id) => document.getElementById(id);
const sessions = {};   // one session per bot, so each bot keeps its own memory
const histories = {};  // chat history per bot (kept while the page is open)
let current = null;

function newSessionId() {
  return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
}

// Render bot cards
BOTS.forEach((bot) => {
  const card = document.createElement("button");
  card.className = "card";
  card.innerHTML = '<div class="emoji"></div><h2></h2><p></p>';
  card.querySelector(".emoji").textContent = bot.emoji;
  card.querySelector("h2").textContent = bot.name;
  card.querySelector("p").textContent = bot.description;
  card.onclick = () => openBot(bot);
  $("grid").appendChild(card);
});

function show(view) {
  document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
  $(view).classList.add("active");
}

function addMessage(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  $("messages").appendChild(el);
  $("messages").scrollTop = $("messages").scrollHeight;
  return el;
}

function openBot(bot) {
  current = bot;
  sessions[bot.id] ??= newSessionId();
  histories[bot.id] ??= [];
  $("bot-title").textContent = bot.emoji + " " + bot.name;
  $("messages").innerHTML = "";
  histories[bot.id].forEach((m) => addMessage(m.role, m.text));
  if (!histories[bot.id].length) addMessage("bot", "Hi! I’m " + bot.name + ". How can I help?");
  show("chat-view");
  $("input").focus();
}

$("back").onclick = () => show("list-view");

async function sendMessage(text) {
  const bot = current;
  addMessage("user", text);
  histories[bot.id].push({ role: "user", text });
  $("send").disabled = true;
  const typing = addMessage("bot", "Typing…");
  typing.classList.add("typing");

  try {
    const res = await fetch(bot.url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(buildRequestBody(text, sessions[bot.id])),
    });
    if (!res.ok) throw new Error("Server responded with " + res.status);
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); } catch { data = raw; }
    const reply = extractReply(data);
    typing.remove();
    addMessage("bot", reply);
    histories[bot.id].push({ role: "bot", text: reply });
  } catch (err) {
    typing.remove();
    addMessage("error", "Could not reach the bot. " + err.message);
  } finally {
    $("send").disabled = false;
    $("input").focus();
  }
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || $("send").disabled) return;
  $("input").value = "";
  $("input").style.height = "auto";
  sendMessage(text);
};

// Enter sends, Shift+Enter makes a new line
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = e.target.scrollHeight + "px";
});
</script>
</body>
</html>
